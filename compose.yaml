services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: passkeys
      POSTGRES_USER: passkeys
      POSTGRES_PASSWORD: passkeys
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passkeys -d passkeys"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.28
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
